name: prn232-lms-lab2

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Lab2_sqlserver_password123}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: PRN232.LMS.API/Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=PRN232LMSLab2;User Id=sa;Password=${DB_PASSWORD:-Lab2_sqlserver_password123};TrustServerCertificate=True;MultipleActiveResultSets=true"
      # Demo defaults keep automated grading self-contained. Override using .env.
      Jwt__Key: "${JWT_SECRET:-prn232-lab2-demo-signing-key-change-before-deployment}"
      Jwt__Issuer: "PRN232.LMS"
      Jwt__Audience: "PRN232.LMS.Client"
      Jwt__ExpirySeconds: "${JWT_EXPIRY_SECONDS:-3600}"
      Jwt__RefreshTokenDays: "7"
      Jwt__UseRefreshTokenCookie: "${JWT_USE_COOKIE:-false}"
      Jwt__CookieSecure: "${JWT_COOKIE_SECURE:-false}"
      Jwt__CleanupIntervalMinutes: "60"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqlserver-data:
